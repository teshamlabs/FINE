<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Таблица посещений</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f9f9f9;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .table-wrapper {
      overflow: auto;
      width: 100%;
      height: 90vh;
      border: 1px solid #ccc;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    iframe {
      width: 1600px;
      height: 800px;
      border: none;
      transform: scale(0.75);
      transform-origin: 0 0;
    }
  </style>
</head>
<body>
  <h1>Отчет по посещениям и штрафам</h1>
  <div class="table-wrapper">
    <iframe 
      src="https://docs.google.com/spreadsheets/d/e/2PACX-1vSw8Y8_6VvAMPlYcJFE6_byjjl_LKd8ycyJkaoU0FvRiMDi76z131po70sYelrji1ZKii7ZV5WLurJ8/pubhtml?gid=1147430086&single=true" 
      scrolling="yes">
    </iframe>
  </div>
</body>
</html>
